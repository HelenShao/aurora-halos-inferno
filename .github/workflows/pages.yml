# Deploy the static site to GitHub Pages.
# GitHub caps the deploy (file sync) at 10 minutes; ~360 MB of movies did not
# fit, so the movies are split across several repos of ~120 MB each.
# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000    # 10 min: GitHub's maximum
